<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>久坐提醒 · 该起身活动了</title>
<style>
  /* ===== 全局基础样式：浅色主题、柔和配色、圆角卡片 ===== */
  :root {
    --主色: #4f8cff;          /* 主色调：柔和蓝 */
    --主色深: #3a6fd6;
    --背景: #f4f7fb;          /* 页面背景 */
    --卡片: #ffffff;          /* 卡片背景 */
    --文字: #2b3445;          /* 主文字 */
    --次文字: #7a869a;        /* 次要文字 */
    --边框: #e6ebf2;          /* 边框线 */
    --成功: #34c77b;          /* 成功绿 */
    --警示: #ff7a59;          /* 提醒橙 */
    --阴影: 0 8px 24px rgba(79, 140, 255, 0.10);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: linear-gradient(160deg, #eef3fb 0%, #f6f0fb 100%);
    color: var(--文字);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .容器 {
    width: 100%;
    max-width: 460px;
  }

  /* 标题区 */
  .标题 {
    text-align: center;
    margin-bottom: 22px;
  }
  .标题 h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 1px;
  }
  .标题 p {
    margin: 6px 0 0;
    color: var(--次文字);
    font-size: 14px;
  }

  /* 返回门户首页入口：标题上方靠左的小胶囊按钮，视觉克制不抢戏
     文字色单独用 #6b7686（白底约 4.6:1，满足 WCAG AA 4.5:1），
     不复用 --次文字(#7a869a，白底仅约 3.68:1，不达标） */
  .返回首页 {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
    padding: 6px 14px;
    font-size: 13px;
    line-height: 1;
    color: #6b7686;
    text-decoration: none;
    background: var(--卡片);
    border: 1px solid var(--边框);
    border-radius: 999px;
    transition: all .15s;
  }
  .返回首页:hover {
    color: var(--主色深);          /* #3a6fd6 白底 4.75:1，达标；边框不算文字对比度，仍可用主色 */
    border-color: var(--主色);
    box-shadow: var(--阴影);
  }
  /* 键盘 Tab 聚焦时的主题色焦点环（只写 :focus-visible，不移除默认焦点环） */
  .返回首页:focus-visible {
    outline: 2px solid var(--主色);
    outline-offset: 2px;
  }
  /* 箭头为纯字符装饰，无需被读屏朗读 */
  .返回首页 .箭头 { font-size: 15px; }

  /* 卡片通用 */
  .卡片 {
    background: var(--卡片);
    border: 1px solid var(--边框);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: var(--阴影);
  }
  .卡片 h2 {
    margin: 0 0 16px;
    font-size: 16px;
    color: var(--主色深);
  }

  /* 倒计时大显示 */
  .倒计时区 {
    text-align: center;
    padding: 30px 22px;
  }
  .倒计时 {
    font-size: 72px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: var(--文字);
    line-height: 1.1;
  }
  .倒计时.运行中 { color: var(--主色); }
  .倒计时.已暂停 { color: var(--次文字); }
  .状态文字 {
    margin-top: 8px;
    font-size: 14px;
    color: var(--次文字);
  }

  /* 表单元素 */
  .字段 { margin-bottom: 18px; }
  .字段:last-child { margin-bottom: 0; }
  .字段标签 {
    display: block;
    font-size: 14px;
    margin-bottom: 8px;
    color: var(--文字);
  }
  .字段标签 .提示 {
    color: var(--次文字);
    font-size: 12px;
    margin-left: 6px;
  }

  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--边框);
    border-radius: 10px;
    outline: none;
    transition: border-color .2s;
  }
  input[type="number"]:focus { border-color: var(--主色); }

  .预设组 {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .预设组 button {
    flex: 1;
    padding: 8px 0;
    font-size: 14px;
    border: 1px solid var(--边框);
    background: #fafcff;
    color: var(--文字);
    border-radius: 10px;
    cursor: pointer;
    transition: all .15s;
  }
  .预设组 button:hover { border-color: var(--主色); color: var(--主色); }
  .预设组 button.选中 {
    background: var(--主色);
    border-color: var(--主色);
    color: #fff;
  }

  /* 按钮通用 */
  .按钮 {
    padding: 11px 16px;
    font-size: 15px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all .15s;
    background: #eef2f8;
    color: var(--文字);
  }
  .按钮:hover { filter: brightness(0.97); }
  .按钮:active { transform: translateY(1px); }
  .按钮.主按钮 { background: var(--主色); color: #fff; }
  .按钮.主按钮:hover { background: var(--主色深); }
  .按钮.次按钮 { background: #eef2f8; }

  .控制组 {
    display: flex;
    gap: 12px;
    margin-top: 6px;
  }
  .控制组 .按钮 { flex: 1; }

  /* 音乐选择行 */
  .音乐行 {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .音乐行 input[type="file"] {
    flex: 1;
    font-size: 13px;
    color: var(--次文字);
  }
  .音乐名 {
    margin-top: 8px;
    font-size: 13px;
    color: var(--次文字);
    word-break: break-all;
  }
  .音乐名.已选 { color: var(--成功); }

  /* 音源切换：本地上传 / 网络链接 二选一 */
  .音源切换 {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .音源切换 button {
    flex: 1;
    padding: 8px 0;
    font-size: 14px;
    border: 1px solid var(--边框);
    background: #fafcff;
    color: var(--文字);
    border-radius: 10px;
    cursor: pointer;
    transition: all .15s;
  }
  .音源切换 button:hover { border-color: var(--主色); color: var(--主色); }
  .音源切换 button.选中 {
    background: var(--主色);
    border-color: var(--主色);
    color: #fff;
  }

  /* 网络链接输入区 */
  .网络区 {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .网络区 input[type="url"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 13px;
    border: 1px solid var(--边框);
    border-radius: 10px;
    outline: none;
    transition: border-color .2s;
  }
  .网络区 input[type="url"]:focus { border-color: var(--主色); }
  .音乐名.失败 { color: var(--警示); }

  /* 音量 */
  input[type="range"] {
    width: 100%;
    accent-color: var(--主色);
  }
  .音量显示 {
    float: right;
    font-size: 13px;
    color: var(--次文字);
  }

  .通知行 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .通知状态 { font-size: 13px; color: var(--次文字); }

  /* 提醒弹窗遮罩 */
  .遮罩 {
    position: fixed;
    inset: 0;
    background: rgba(43, 52, 69, 0.45);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .遮罩.显示 { display: flex; }
  .弹窗 {
    background: var(--卡片);
    border-radius: 22px;
    padding: 36px 32px;
    text-align: center;
    max-width: 360px;
    width: calc(100% - 48px);
    box-shadow: 0 16px 48px rgba(0,0,0,.2);
    animation: 弹出 .25s ease;
  }
  @keyframes 弹出 {
    from { transform: scale(.9); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }
  .弹窗 .图标 { font-size: 54px; }
  .弹窗 h2 {
    margin: 12px 0 8px;
    font-size: 24px;
    color: var(--警示);
  }
  .弹窗 p {
    margin: 0 0 22px;
    color: var(--次文字);
    font-size: 14px;
    line-height: 1.6;
  }

  .页脚 {
    text-align: center;
    font-size: 12px;
    color: var(--次文字);
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="容器">
    <!-- 返回门户首页：用相对路径 ../ 指向 /game-account-manager/
         （GitHub Pages 项目页下写成根路径 / 会跳到域名根，导致 404，务必保持相对路径） -->
    <a class="返回首页" href="../" title="返回首页">
      <span class="箭头" aria-hidden="true">&#8592;</span>返回首页
    </a>

    <div class="标题">
      <h1>久坐提醒</h1>
      <p>坐得太久，记得起来活动一下身体 🌿</p>
    </div>

    <!-- 倒计时显示卡片 -->
    <div class="卡片 倒计时区">
      <div id="倒计时" class="倒计时 已暂停">45:00</div>
      <div id="状态文字" class="状态文字">未开始</div>
    </div>

    <!-- 计时控制 -->
    <div class="卡片">
      <div class="控制组">
        <button id="开始暂停按钮" class="按钮 主按钮">开始</button>
        <button id="重置按钮" class="按钮 次按钮">重置</button>
      </div>
    </div>

    <!-- 设置卡片 -->
    <div class="卡片">
      <h2>提醒设置</h2>

      <!-- 提醒间隔 -->
      <div class="字段">
        <label class="字段标签" for="间隔输入">
          提醒间隔（分钟）<span class="提示">1–180</span>
        </label>
        <input id="间隔输入" type="number" min="1" max="180" step="1" value="45">
        <div class="预设组" id="预设组">
          <button data-分钟="30">30</button>
          <button data-分钟="45" class="选中">45</button>
          <button data-分钟="60">60</button>
          <button data-分钟="90">90</button>
        </div>
      </div>

      <!-- 提示音乐 -->
      <div class="字段">
        <label class="字段标签" for="音乐输入">提示音乐</label>

        <!-- 音源切换：本地上传 / 网络链接 -->
        <div class="音源切换" id="音源切换">
          <button type="button" data-音源="本地" class="选中">本地上传</button>
          <button type="button" data-音源="网络">网络链接</button>
        </div>

        <!-- 本地上传区 -->
        <div class="音乐行" id="本地区">
          <input id="音乐输入" type="file" accept="audio/*">
          <button id="试听按钮" class="按钮 次按钮">试听</button>
        </div>

        <!-- 网络链接区 -->
        <div class="网络区" id="网络区" style="display:none;">
          <input id="网络输入" type="url" placeholder="粘贴音频直链，如 https://xxx.com/xxx.mp3">
          <button id="加载试听按钮" class="按钮 次按钮">加载试听</button>
        </div>

        <div id="音乐名" class="音乐名">未选择（将使用默认蜂鸣声）</div>
      </div>

      <!-- 音量 -->
      <div class="字段">
        <label class="字段标签" for="音量输入">
          音量<span class="音量显示" id="音量显示">70%</span>
        </label>
        <input id="音量输入" type="range" min="0" max="100" value="70">
      </div>

      <!-- 桌面通知 -->
      <div class="字段">
        <div class="通知行">
          <div>
            <label class="字段标签" style="margin-bottom:2px;">桌面通知</label>
            <span class="通知状态" id="通知状态">未开启</span>
          </div>
          <button id="通知按钮" class="按钮 次按钮">开启通知</button>
        </div>
      </div>
    </div>

    <div class="页脚">设置会自动保存 · 网络音乐链接刷新后保留，本地文件需重新选择</div>
  </div>

  <!-- 提醒弹窗 -->
  <div class="遮罩" id="遮罩">
    <div class="弹窗">
      <div class="图标">🧍💨</div>
      <h2>该起身活动了！</h2>
      <p>您已久坐一段时间，起来走走、伸展一下，喝口水吧～</p>
      <button id="知道了按钮" class="按钮 主按钮" style="width:100%;">我知道了</button>
    </div>
  </div>

  <!-- 隐藏的音频播放器 -->
  <audio id="音频" loop preload="auto"></audio>

<script>
"use strict";
/* =========================================================
 * 久坐提醒 · 单文件实现
 * 关键点：
 *  1) 基于时间戳计时（记录目标结束时刻），避免后台被节流导致计时漂移
 *  2) 音乐用 <audio>：本地上传走 URL.createObjectURL，网络链接走 http(s) 直链；未选则用 Web Audio 蜂鸣兜底
 *  3) 浏览器自动播放限制：AudioContext 在用户交互后初始化/解锁
 *  4) 间隔、音量、网络音乐地址持久化到 localStorage；音频文件对象无法持久化
 *  5) 计时进度也持久化（键 jiuzu_timer，存「目标结束时刻」时间戳）：
 *     刷新 / 关掉页面再打开都不会重置倒计时，页面关着的这段时间照样在走；
 *     只有点「重置」按钮才把时间归零重来
 * ========================================================= */

// ---------- DOM 引用 ----------
const 倒计时元素   = document.getElementById("倒计时");
const 状态文字元素 = document.getElementById("状态文字");
const 开始暂停按钮 = document.getElementById("开始暂停按钮");
const 重置按钮     = document.getElementById("重置按钮");
const 间隔输入     = document.getElementById("间隔输入");
const 预设组       = document.getElementById("预设组");
const 音乐输入     = document.getElementById("音乐输入");
const 试听按钮     = document.getElementById("试听按钮");
const 音乐名元素   = document.getElementById("音乐名");
const 音源切换     = document.getElementById("音源切换");
const 本地区       = document.getElementById("本地区");
const 网络区       = document.getElementById("网络区");
const 网络输入     = document.getElementById("网络输入");
const 加载试听按钮 = document.getElementById("加载试听按钮");
const 音量输入     = document.getElementById("音量输入");
const 音量显示     = document.getElementById("音量显示");
const 通知按钮     = document.getElementById("通知按钮");
const 通知状态     = document.getElementById("通知状态");
const 遮罩元素     = document.getElementById("遮罩");
const 知道了按钮   = document.getElementById("知道了按钮");
const 音频元素     = document.getElementById("音频");

// ---------- 本地存储键名 ----------
const 键_间隔 = "jiuzu_interval";
const 键_音量 = "jiuzu_volume";
const 键_网络音乐 = "jiuzu_music_url";
const 键_计时 = "jiuzu_timer";   // 计时进度（刷新不重置计时靠它）

// ---------- 安全的本地存储读写（隐私模式 / 存储禁用 / 配额满 时会抛错，必须兜底） ----------
function 读取存储(键) {
  try {
    return localStorage.getItem(键);
  } catch (e) {
    return null; // 读取失败则视为无值
  }
}
function 删除存储(键) {
  try {
    localStorage.removeItem(键);
  } catch (e) {
    // 静默忽略
  }
}
function 写入存储(键, 值) {
  try {
    localStorage.setItem(键, 值);
  } catch (e) {
    // 静默忽略：不让存储异常中断主流程
  }
}

// ---------- 运行时状态 ----------
const 状态 = {
  间隔分钟: 45,            // 提醒间隔（分钟）
  音量: 0.7,              // 0~1
  运行中: false,          // 是否正在倒计时
  目标结束时刻: 0,        // 时间戳（毫秒）：倒计时归零的时刻
  暂停剩余毫秒: 45 * 60 * 1000, // 暂停时保留的剩余时间
  音乐文件: null,         // 用户选择的 File 对象
  音乐URL: "",            // <audio> 当前使用的 src（本地为 blob: 对象地址，网络为 http(s) 直链）
  音源类型: "本地",       // "本地" | "网络"，当前生效的音源
  网络地址: "",           // 用户输入并持久化的网络音乐地址
  提醒中: false,          // 是否正处于提醒弹窗
  蜂鸣定时器: null        // Web Audio 蜂鸣循环句柄
};

// Web Audio 相关（用于无音乐时的兜底提示音）
let 音频上下文 = null;

// 每秒刷新显示用的定时器
let 心跳定时器 = null;

// =========================================================
// 计时进度的持久化 ——「刷新不重置倒计时」的核心
// 存的是「目标结束时刻」这个**绝对时间戳**，而不是剩余秒数，
// 因此页面关着的那段时间照样被计入：这才是"刷新不重置"的关键。
// 只有点「重置」才会清掉存档、把时间归零重来。
// =========================================================
const 计时态_未开始 = "未开始";
const 计时态_计时中 = "计时中";
const 计时态_已暂停 = "已暂停";
const 计时态_已提醒 = "已提醒";   // 到点了、但用户还没点「我知道了」

function 保存计时状态(状态名) {
  // 剩余量按当前状态推算，保证存档自洽（计时中取"目标结束时刻 - 现在"，其余取暂存量）
  const 剩余 = (状态名 === 计时态_计时中)
    ? Math.max(0, 状态.目标结束时刻 - Date.now())
    : Math.max(0, 状态.暂停剩余毫秒);
  写入存储(键_计时, JSON.stringify({
    版本: 1,
    状态名: 状态名,
    目标结束时刻: 状态.目标结束时刻,     // 仅「计时中」有意义
    剩余毫秒: 剩余,
    间隔分钟: 状态.间隔分钟
  }));
}

// 读取存档并还原界面（含"关页面期间已经到点"的补提醒）
function 恢复计时状态() {
  const 原文 = 读取存储(键_计时);
  if (!原文) return;                      // 首次访问：沿用「未开始 + 整个间隔」
  let 存档 = null;
  try { 存档 = JSON.parse(原文); } catch (e) { 存档 = null; }
  if (!存档 || typeof 存档 !== "object") { 删除存储(键_计时); return; }   // 数据损坏则丢弃

  const 状态名 = 存档.状态名;
  const 存剩余 = Number(存档.剩余毫秒);

  // ① 正在计时 → 用目标结束时刻续算，页面关闭的时间自动扣除
  if (状态名 === 计时态_计时中) {
    const 剩余 = Number(存档.目标结束时刻) - Date.now();
    if (isFinite(剩余) && 剩余 > 0) {
      开始计时(剩余);      // 接着上次的进度跑
    } else {
      开始计时(0);         // 关页面期间已到点 → 打开就立刻补一次提醒
    }
    return;
  }

  // ② 上一轮到点后没确认就刷新了 → 再提醒一次，别让人漏掉
  if (状态名 === 计时态_已提醒) {
    状态.暂停剩余毫秒 = 0;
    渲染倒计时(0);
    触发提醒();
    return;
  }

  // ③ 暂停中 → 原样恢复剩余时间，仍处于「已暂停」
  if (状态名 === 计时态_已暂停 && isFinite(存剩余) && 存剩余 > 0) {
    状态.运行中 = false;
    状态.暂停剩余毫秒 = 存剩余;
    开始暂停按钮.textContent = "继续";
    倒计时元素.classList.add("已暂停");
    倒计时元素.classList.remove("运行中");
    状态文字元素.textContent = "已暂停";
    渲染倒计时(存剩余);
    return;
  }

  // ④ 未开始（或存档字段异常）→ 沿用存档里的剩余量，默认即整个间隔
  状态.运行中 = false;
  if (isFinite(存剩余) && 存剩余 > 0) 状态.暂停剩余毫秒 = 存剩余;
  开始暂停按钮.textContent = "开始";
  倒计时元素.classList.add("已暂停");
  倒计时元素.classList.remove("运行中");
  状态文字元素.textContent = "未开始";
  渲染倒计时(状态.暂停剩余毫秒);
}

// =========================================================
// 初始化：恢复持久化设置
// =========================================================
function 初始化() {
  // 恢复间隔
  const 存间隔 = parseInt(读取存储(键_间隔), 10);
  if (!isNaN(存间隔) && 存间隔 >= 1 && 存间隔 <= 180) {
    状态.间隔分钟 = 存间隔;
  }
  // 恢复音量
  const 存音量 = parseInt(读取存储(键_音量), 10);
  if (!isNaN(存音量) && 存音量 >= 0 && 存音量 <= 100) {
    状态.音量 = 存音量 / 100;
  }

  // 回填界面
  间隔输入.value = 状态.间隔分钟;
  音量输入.value = Math.round(状态.音量 * 100);
  音量显示.textContent = Math.round(状态.音量 * 100) + "%";
  音频元素.volume = 状态.音量;
  高亮预设(状态.间隔分钟);

  // 恢复网络音乐（本地文件无法持久化，故网络链接优先回填）
  const 存网络 = 读取存储(键_网络音乐);
  if (存网络) {
    状态.网络地址 = 存网络;
    状态.音源类型 = "网络";
    网络输入.value = 存网络;
    状态.音乐URL = 存网络;          // 设置 src 但不在初始化时播放（浏览器也会拦截）
    音频元素.src = 存网络;
    音频元素.load();
    本地区.style.display = "none";
    网络区.style.display = "";
    音源切换.querySelectorAll("button").forEach(b => {
      b.classList.toggle("选中", b.dataset.音源 === "网络");
    });
    设置音乐名("已设置网络音乐：" + 存网络, true);
  } else {
    状态.音源类型 = "本地";
    本地区.style.display = "";
    网络区.style.display = "none";
    设置音乐名("未选择（将使用默认蜂鸣声）", false);
  }

  // 初始显示（先用「整个间隔 + 未开始」铺底）
  状态.暂停剩余毫秒 = 状态.间隔分钟 * 60 * 1000;
  渲染倒计时(状态.暂停剩余毫秒);
  更新通知界面();

  // 绑定事件（必须在恢复计时之前：恢复过程中可能立刻触发提醒，事件需已就绪）
  绑定事件();

  // 再恢复上次的计时进度 —— 刷新 / 重开页面都不会重置倒计时
  恢复计时状态();
}

// =========================================================
// 事件绑定
// =========================================================
function 绑定事件() {
  开始暂停按钮.addEventListener("click", 切换开始暂停);
  重置按钮.addEventListener("click", 重置);

  间隔输入.addEventListener("change", () => {
    let v = parseInt(间隔输入.value, 10);
    if (isNaN(v)) v = 45;
    v = Math.min(180, Math.max(1, v));
    间隔输入.value = v;
    状态.间隔分钟 = v;
    写入存储(键_间隔, String(v));
    高亮预设(v);
    // 仅在未运行时更新待开始的剩余时间
    if (!状态.运行中 && !状态.提醒中) {
      状态.暂停剩余毫秒 = v * 60 * 1000;
      渲染倒计时(状态.暂停剩余毫秒);
      // 改间隔＝按新时长重新铺底，所以界面状态要一并归到「未开始」：
      // 否则会出现"按钮还写着继续、存档却已是未开始"的两头不一致，刷新后暂停进度凭空消失
      开始暂停按钮.textContent = "开始";
      倒计时元素.classList.remove("运行中");
      倒计时元素.classList.add("已暂停");
      状态文字元素.textContent = "未开始";
      保存计时状态(计时态_未开始);
    }
  });

  // 预设按钮
  预设组.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const 分钟 = parseInt(btn.dataset.分钟, 10);
      间隔输入.value = 分钟;
      间隔输入.dispatchEvent(new Event("change"));
    });
  });

  // 选择音乐文件（本地上传）
  音乐输入.addEventListener("change", () => {
    应用本地文件(音乐输入.files && 音乐输入.files[0]);
  });

  // 音源切换：本地上传 / 网络链接
  音源切换.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => 切换音源(btn.dataset.音源));
  });

  // 网络链接：加载并试听
  加载试听按钮.addEventListener("click", () => 加载网络音乐(true));

  // 音频加载失败（如网络链接非直链 / 跨域受限 / 已失效）→ 明确提示并回退蜂鸣
  音频元素.addEventListener("error", () => {
    if (状态.音源类型 === "网络" && 状态.音乐URL) {
      设置音乐名("链接无法播放：可能不是音频直链、跨域受限或已失效", false, true);
      状态.音乐URL = "";                  // 标记不可用，后续提醒走蜂鸣兜底
      音频元素.removeAttribute("src");
      // 若正处于提醒弹窗，立即回退到蜂鸣兜底，避免弹窗开着却静默无声
      // （此时 play() 可能早已 resolve，.catch 不会再次触发，必须在此兜底）
      if (状态.提醒中) {
        音频元素.pause();
        开始蜂鸣循环();
      }
    }
  });

  // 试听（本地上传音源）
  试听按钮.addEventListener("click", () => {
    解锁音频();          // 用户手势中解锁 AudioContext
    if (当前有音乐()) {
      音频元素.loop = false; // 试听不循环，避免与上轮 loop 状态串扰
      音频元素.currentTime = 0;
      音频元素.volume = 状态.音量;
      音频元素.play().catch(() => {});
      // 试听 3 秒后自动停止（不循环占用）
      setTimeout(() => { if (!状态.提醒中) 音频元素.pause(); }, 3000);
    } else {
      // 没有音乐则试听蜂鸣
      播放蜂鸣();
    }
  });

  // 音量调节
  音量输入.addEventListener("input", () => {
    const 百分比 = parseInt(音量输入.value, 10);
    状态.音量 = 百分比 / 100;
    音量显示.textContent = 百分比 + "%";
    音频元素.volume = 状态.音量;
    写入存储(键_音量, String(百分比));
  });

  // 桌面通知
  通知按钮.addEventListener("click", 请求通知权限);

  // 关闭提醒
  知道了按钮.addEventListener("click", 关闭提醒);

  // 从后台切回时立即校正剩余时间
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && 状态.运行中 && !状态.提醒中) {
      校正倒计时();
    }
  });

  // 恢复的计时可能一打开页面就已到点（提醒在无用户手势时弹出），此时浏览器会拦住声音。
  // 挂一次性的「首次交互解锁」：用户随便点一下/按一下，AudioContext 就恢复，蜂鸣立刻能听见。
  const 首次交互解锁 = () => 解锁音频();
  document.addEventListener("pointerdown", 首次交互解锁, { once: true });
  document.addEventListener("keydown", 首次交互解锁, { once: true });

  // 页面卸载时释放本地上传生成的 ObjectURL，避免内存泄漏（网络地址非对象 URL，绝不 revoke）
  window.addEventListener("beforeunload", () => {
    if (状态.音乐URL && 状态.音乐URL.indexOf("blob:") === 0) {
      URL.revokeObjectURL(状态.音乐URL);
      状态.音乐URL = "";
    }
  });
}

// =========================================================
// 计时逻辑（基于时间戳）
// =========================================================
function 切换开始暂停() {
  解锁音频(); // 用户手势中解锁音频上下文

  if (状态.提醒中) return; // 弹窗期间忽略

  if (状态.运行中) {
    // 暂停：保留剩余时间
    状态.暂停剩余毫秒 = Math.max(0, 状态.目标结束时刻 - Date.now());
    状态.运行中 = false;
    停止心跳();
    开始暂停按钮.textContent = "继续";
    倒计时元素.classList.remove("运行中");
    倒计时元素.classList.add("已暂停");
    状态文字元素.textContent = "已暂停";
    渲染倒计时(状态.暂停剩余毫秒);
    保存计时状态(计时态_已暂停);   // 暂停进度也持久化
  } else {
    // 开始 / 继续
    开始计时(状态.暂停剩余毫秒 > 0 ? 状态.暂停剩余毫秒 : 状态.间隔分钟 * 60 * 1000);
  }
}

function 开始计时(时长毫秒) {
  状态.目标结束时刻 = Date.now() + 时长毫秒;
  状态.运行中 = true;
  开始暂停按钮.textContent = "暂停";
  倒计时元素.classList.add("运行中");
  倒计时元素.classList.remove("已暂停");
  状态文字元素.textContent = "倒计时中…";
  保存计时状态(计时态_计时中);    // 先落盘：校正倒计时可能立刻到点触发提醒，会把状态改写成「已提醒」
  启动心跳();
  校正倒计时();
}

function 重置() {
  状态.运行中 = false;
  状态.提醒中 = false;
  状态.暂停剩余毫秒 = 状态.间隔分钟 * 60 * 1000;
  停止心跳();
  停止提醒声音();
  遮罩元素.classList.remove("显示");
  开始暂停按钮.textContent = "开始";
  倒计时元素.classList.remove("运行中");
  倒计时元素.classList.add("已暂停");
  状态文字元素.textContent = "未开始";
  渲染倒计时(状态.暂停剩余毫秒);
  保存计时状态(计时态_未开始);    // 只有这里会把计时归零重来
}

// 每秒心跳：依据时间戳刷新显示，归零则触发提醒
function 启动心跳() {
  停止心跳();
  心跳定时器 = setInterval(() => {
    if (!状态.运行中) return;
    const 剩余 = 状态.目标结束时刻 - Date.now();
    if (剩余 <= 0) {
      渲染倒计时(0);
      触发提醒();
    } else {
      渲染倒计时(剩余);
    }
  }, 250);
}

function 停止心跳() {
  if (心跳定时器) { clearInterval(心跳定时器); 心跳定时器 = null; }
}

// 从后台返回时校正（核心：用时间戳纠正被节流的时间差）
function 校正倒计时() {
  if (!状态.运行中) return;
  const 剩余 = 状态.目标结束时刻 - Date.now();
  if (剩余 <= 0) {
    渲染倒计时(0);
    触发提醒();
  } else {
    渲染倒计时(剩余);
  }
}

// 把毫秒渲染成 MM:SS 或 HH:MM:SS
function 渲染倒计时(毫秒) {
  let 总秒 = Math.max(0, Math.floor(毫秒 / 1000));
  const 时 = Math.floor(总秒 / 3600);
  总秒 %= 3600;
  const 分 = Math.floor(总秒 / 60);
  const 秒 = 总秒 % 60;
  const 补 = n => String(n).padStart(2, "0");
  if (时 > 0) {
    倒计时元素.textContent = `${补(时)}:${补(分)}:${补(秒)}`;
  } else {
    倒计时元素.textContent = `${补(分)}:${补(秒)}`;
  }
}

function 高亮预设(分钟) {
  预设组.querySelectorAll("button").forEach(b => {
    b.classList.toggle("选中", parseInt(b.dataset.分钟, 10) === 分钟);
  });
}

// =========================================================
// 提醒触发与声音
// =========================================================
function 触发提醒() {
  if (状态.提醒中) return;
  状态.提醒中 = true;
  状态.运行中 = false;
  停止心跳();
  状态文字元素.textContent = "时间到！请起身活动";
  保存计时状态(计时态_已提醒);   // 先落盘（到点未确认）：刷新后再提醒一次，不漏提醒

  // 桌面通知（若已授权）
  发送桌面通知();

  // 播放提示音（循环直到关闭）
  播放提醒声音();

  // 显示弹窗
  遮罩元素.classList.add("显示");
}

function 关闭提醒() {
  状态.提醒中 = false;
  停止提醒声音();
  遮罩元素.classList.remove("显示");
  // 自动开始下一轮倒计时
  状态.暂停剩余毫秒 = 状态.间隔分钟 * 60 * 1000;
  开始计时(状态.暂停剩余毫秒);
}

// 播放提醒音：有音乐则循环播放 <audio>，否则用 Web Audio 蜂鸣循环
function 播放提醒声音() {
  解锁音频();
  if (当前有音乐()) {
    音频元素.currentTime = 0;
    音频元素.volume = 状态.音量;
    音频元素.loop = true;
    音频元素.play().catch(() => {
      // 万一自动播放被拦，退回到蜂鸣
      开始蜂鸣循环();
    });
  } else {
    开始蜂鸣循环();
  }
}

function 停止提醒声音() {
  音频元素.pause();
  音频元素.loop = false;
  if (状态.蜂鸣定时器) {
    clearInterval(状态.蜂鸣定时器);
    状态.蜂鸣定时器 = null;
  }
}

// 当前是否有可用音乐（本地或网络任一音源均可）
function 当前有音乐() {
  return !!状态.音乐URL;
}

// 统一设置音乐状态文案（已选=绿 / 失败=橙 / 否则=灰）
function 设置音乐名(文本, 已选, 失败) {
  音乐名元素.textContent = 文本;
  音乐名元素.classList.toggle("已选", !!已选);
  音乐名元素.classList.toggle("失败", !!失败);
}

// 应用本地文件：创建对象 URL 并设置音频源（自带旧对象 URL 释放，绝不误 revoke 网络地址）
function 应用本地文件(文件) {
  if (状态.音乐URL && 状态.音乐URL.indexOf("blob:") === 0) {
    URL.revokeObjectURL(状态.音乐URL); // 仅当确为本地对象 URL 才释放
  }
  状态.音乐URL = "";
  if (文件) {
    状态.音乐文件 = 文件;
    状态.音乐URL = URL.createObjectURL(文件);
    音频元素.src = 状态.音乐URL;
    音频元素.load();
    设置音乐名("已选择本地文件：" + 文件.name, true);
  } else {
    状态.音乐文件 = null;
    音频元素.removeAttribute("src");
    设置音乐名("未选择（将使用默认蜂鸣声）", false);
  }
}

// 切换音源：本地上传 <-> 网络链接
function 切换音源(类型) {
  if (类型 !== "本地" && 类型 !== "网络") return;
  if (类型 === 状态.音源类型) return;
  // 离开旧音源：仅释放本地对象 URL（网络地址非对象 URL，绝不 revoke）
  if (状态.音乐URL && 状态.音乐URL.indexOf("blob:") === 0) {
    URL.revokeObjectURL(状态.音乐URL);
  }
  状态.音乐URL = "";
  状态.音乐文件 = null;
  音频元素.removeAttribute("src");

  状态.音源类型 = 类型;
  音源切换.querySelectorAll("button").forEach(b => {
    b.classList.toggle("选中", b.dataset.音源 === 类型);
  });

  if (类型 === "本地") {
    本地区.style.display = "";
    网络区.style.display = "none";
    // 切回本地时若文件选择框仍有文件，自动复用
    if (音乐输入.files && 音乐输入.files[0]) {
      应用本地文件(音乐输入.files[0]);
    } else {
      设置音乐名("未选择（将使用默认蜂鸣声）", false);
    }
  } else {
    本地区.style.display = "none";
    网络区.style.display = "";
    // 若此前已保存网络地址，自动回填并恢复，无需重新加载
    if (状态.网络地址) {
      网络输入.value = 状态.网络地址;
      状态.音乐URL = 状态.网络地址;
      音频元素.src = 状态.网络地址;
      音频元素.load();
      设置音乐名("已设置网络音乐：" + 状态.网络地址, true);
    } else {
      设置音乐名("请输入并加载网络音乐链接", false);
    }
  }
}

// 加载网络音乐：校验 + 持久化 + 试听预览
function 加载网络音乐(是否试听) {
  解锁音频();
  const 原 = (网络输入.value || "").trim();
  if (!原) {
    设置音乐名("请先粘贴音频链接", false, true);
    return;
  }
  if (!/^https?:\/\//i.test(原)) {
    设置音乐名("链接格式不正确：需以 http:// 或 https:// 开头", false, true);
    return;
  }
  const 混合内容 = (location.protocol === "https:" && /^http:\/\//i.test(原));
  写入存储(键_网络音乐, 原);
  状态.网络地址 = 原;
  // 若之前是本地音源，释放其对象 URL
  if (状态.音乐URL && 状态.音乐URL.indexOf("blob:") === 0) {
    URL.revokeObjectURL(状态.音乐URL);
  }
  状态.音源类型 = "网络";
  状态.音乐文件 = null;
  状态.音乐URL = 原;
  音频元素.src = 原;
  音频元素.load();
  if (混合内容) {
    设置音乐名("已设置网络音乐（警告：https 页面用 http 链接可能被拦截，建议换 https）：" + 原, false, true);
  } else {
    设置音乐名("已设置网络音乐：" + 原, true);
  }
  if (是否试听) 预览网络音乐();
}

// 预览网络音乐：不循环，3 秒后自动停止；加载/播放失败则回退蜂鸣，不静默失败
function 预览网络音乐() {
  音频元素.loop = false;
  音频元素.currentTime = 0;
  音频元素.volume = 状态.音量;
  音频元素.play().catch(() => {
    设置音乐名("链接无法播放：可能不是音频直链、跨域受限或已失效", false, true);
    状态.音乐URL = "";                 // 标记不可用，后续提醒走蜂鸣兜底
    音频元素.removeAttribute("src");
    播放蜂鸣();                         // 用蜂鸣给出反馈
  });
  setTimeout(() => { if (!状态.提醒中) 音频元素.pause(); }, 3000);
}

// ---- Web Audio 兜底蜂鸣 ----
// 在首次用户交互时创建/恢复 AudioContext，绕过自动播放限制
function 解锁音频() {
  try {
    if (!音频上下文) {
      音频上下文 = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (音频上下文.state === "suspended") {
      音频上下文.resume();
    }
  } catch (e) {
    // 某些环境不支持，忽略
  }
}

function 播放蜂鸣() {
  if (!音频上下文) return;
  const 有效音量 = 状态.音量;
  if (有效音量 <= 0) return; // 静音时彻底不发声
  const 上下文 = 音频上下文;
  const 振荡器 = 上下文.createOscillator();
  const 增益 = 上下文.createGain();
  振荡器.type = "sine";
  振荡器.frequency.value = 880; // 提示音频率
  增益.gain.value = 0.0001;
  振荡器.connect(增益);
  增益.connect(上下文.destination);
  const 现在 = 上下文.currentTime;
  // 简单包络，避免爆音（指数斜坡不可为 0，用极小值过渡）
  增益.gain.setValueAtTime(0.0001, 现在);
  增益.gain.exponentialRampToValueAtTime(有效音量, 现在 + 0.02);
  增益.gain.exponentialRampToValueAtTime(0.0001, 现在 + 0.4);
  振荡器.start(现在);
  振荡器.stop(现在 + 0.42);
}

function 开始蜂鸣循环() {
  if (状态.蜂鸣定时器) return;
  播放蜂鸣(); // 先响一声
  状态.蜂鸣定时器 = setInterval(播放蜂鸣, 1800); // 之后每 1.8 秒一声
}

// =========================================================
// 桌面通知
// =========================================================
function 请求通知权限() {
  if (!("Notification" in window)) {
    通知状态.textContent = "浏览器不支持";
    return;
  }
  if (Notification.permission === "granted") {
    通知状态.textContent = "已开启";
    return;
  }
  Notification.requestPermission().then(结果 => {
    更新通知界面();
  });
}

function 更新通知界面() {
  if (!("Notification" in window)) {
    通知状态.textContent = "不支持";
    通知按钮.textContent = "不可用";
    通知按钮.disabled = true;
    return;
  }
  if (Notification.permission === "granted") {
    通知状态.textContent = "已开启";
    通知按钮.textContent = "已开启";
    通知按钮.disabled = true;
  } else if (Notification.permission === "denied") {
    通知状态.textContent = "已拒绝";
    通知按钮.textContent = "被拒绝";
    通知按钮.disabled = true;
  } else {
    通知状态.textContent = "未开启";
    通知按钮.textContent = "开启通知";
    通知按钮.disabled = false;
  }
}

function 发送桌面通知() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    new Notification("该起身活动了！", {
      body: "您已久坐一段时间，起来走走、伸展一下吧～",
      // 部分浏览器需要 icon，留空即可
    });
  } catch (e) {
    // 忽略
  }
}

// =========================================================
// 启动
// =========================================================
初始化();
</script>
